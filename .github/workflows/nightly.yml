name: Nightly compatibility tests

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    name: Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            dependencies: pinned-baseline
          - python-version: '3.12'
            dependencies: newest-compatible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.dependencies }}" = "pinned-baseline" ]; then
            python -m pip install -c ci/constraints-py311.txt '.[test,provenance]'
          else
            python -m pip install '.[test,provenance]'
          fi
      - name: Run extended suite
        run: python -m pytest -m 'unit or acceptance or extended' --require-feature-deps --strict-markers --junitxml=test-results/pytest.xml
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          TRASHPANDA_EXTENDED_SEED: '17'
      - name: Capture environment and upload evidence
        if: always()
        run: python -m pip freeze > test-results/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.python-version }}-${{ matrix.dependencies }}-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
