name: Release validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Create clean environment outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/trashpanda-release-venv"
          "$RUNNER_TEMP/trashpanda-release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/trashpanda-release-venv/bin/python" -m pip install dist/*.whl 'pytest>=7' 'cryptography>=41'
      - name: Run installed-package acceptance smoke
        run: |
          mkdir -p "$RUNNER_TEMP/trashpanda-smoke"
          cd "$RUNNER_TEMP/trashpanda-smoke"
          env -u PYTHONPATH "$RUNNER_TEMP/trashpanda-release-venv/bin/python" -c 'import trashpanda, pathlib; p=pathlib.Path(trashpanda.__file__).resolve(); assert "site-packages" in str(p), p; print(p)'
          cp "$GITHUB_WORKSPACE/scripts/release_smoke.py" .
          env -u PYTHONPATH HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 "$RUNNER_TEMP/trashpanda-release-venv/bin/python" release_smoke.py
      - name: Hash and retain evidence
        if: always()
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          python -m pip freeze > dist/validation-pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            dist/
            ${{ runner.temp }}/trashpanda-smoke/
