name: Container images

# Builds the pascal and modern images, tests each inside itself (CPU stages:
# unit + acceptance suite and the tiny end-to-end run through transformers),
# and pushes to GHCR on main and on version tags. GPU stages run separately on
# self-hosted GPU hosts with docker/test-image.sh.
#
# Third-party actions are pinned to major versions here; pin them to commit
# SHAs if this workflow ever moves to an apache/* repository (ASF policy).

on:
  pull_request:
    paths: ['docker/**', 'src/**', 'scripts/**', 'tests/**', 'pyproject.toml', '.dockerignore', '.github/workflows/docker.yml']
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: pascal
            cuda: cu126
          - flavor: modern
            cuda: cu130
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/trashpanda
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch layers are ~3 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: tags
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          short=${GITHUB_SHA::7}
          tags="$image:sha-$short-${{ matrix.flavor }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$tags,$image:${GITHUB_REF_NAME#v}-${{ matrix.flavor }}-${{ matrix.cuda }}"
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags="$tags,$image:main-${{ matrix.flavor }}"
          fi
          echo "local=trashpanda:ci-${{ matrix.flavor }}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            FLAVOR=${{ matrix.flavor }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.local }}
          load: true
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

      - name: Test inside the image (no GPU)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -e CUDA_VISIBLE_DEVICES= -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            -w /opt/trashpanda ${{ steps.tags.outputs.local }} \
            python -m pytest -q -p no:cacheprovider -m "unit or acceptance"
          docker run --rm -e CUDA_VISIBLE_DEVICES= -v "$PWD/out:/out" ${{ steps.tags.outputs.local }} \
            python /opt/trashpanda/docker/tests/e2e.py --mode tiny --out /out/e2e-tiny

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tiny-${{ matrix.flavor }}
          path: out/
          if-no-files-found: warn

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IFS=',' read -ra tags <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${tags[@]}"; do
            docker tag ${{ steps.tags.outputs.local }} "$tag"
            docker push "$tag"
          done
          docker inspect --format '{{index .RepoDigests 0}}' "${tags[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
